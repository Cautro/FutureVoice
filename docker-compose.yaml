
name: futurevoice

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - database

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    restart: unless-stopped

    environment:
      APP_ENV: production
      APP_ADDR: ":8080"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8080"

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - frontend
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1/ || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend:
  database:
    internal: true
